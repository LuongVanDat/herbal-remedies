# Sinh tự động bởi scripts/trich/sinh-du-lieu.ts từ QĐ 5013/QĐ-BYT — sửa bản trích rồi chạy lại
id: bi-dai-co-nang
ten: Bí đái cơ năng (Long bế)
ten_khac:
  - Long bế
  - Lung bế
  - bí tiểu
dau_hieu_nguy_hiem:
  - id: nh-bi-dai-co-nang-1
    ten: Đã châm mà không kết quả (vẫn không tiểu được) — chuyển đặt sonde tiểu, nếu thất bại thì điều trị ngoại khoa

# Sinh tự động bởi scripts/trich/sinh-du-lieu.ts từ QĐ 5013/QĐ-BYT — sửa bản trích rồi chạy lại
id: liet-day-than-kinh-mat
ten: Bệnh dây thần kinh mặt (Khẩu nhãn oa tà)
ten_khac:
  - Khẩu nhãn oa tà
  - liệt dây thần kinh VII ngoại biên
  - liệt mặt
  - trúng phong kinh lạc
dau_hieu_nguy_hiem:
  - id: nh-liet-day-than-kinh-mat-1
    ten: Liệt ngày càng nặng, sau điều trị đến ngày thứ 21 vẫn không thấy dấu hiệu hồi phục
  - id: nh-liet-day-than-kinh-mat-2
    ten: Liệt mặt do viêm tai cấp hoặc mạn tính, điều trị 4 - 5 tuần không phục hồi
  - id: nh-liet-day-than-kinh-mat-3

        - thay-doi-tu-the-thi-dau-tang
        - chat-luoi-tim-co-diem-u-huyet
        - mach-sap
      phu: []
    loai_tru: []
    phap_tri: Hoạt huyết hóa ứ, thư cân hoạt lạc.
    bai_thuoc:
      - dau-that-lung-than-thong-truc-u-thang
      - dau-that-lung-nghiem-phuong-huyet-u
